<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0b1020"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#22304a" stroke-width="8"/>

  <!-- Shadow -->
  <text x="256" y="340"
        text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="320"
        font-weight="900"
        fill="#000" opacity="0.35">T</text>

  <!-- Golden T -->
  <text x="256" y="332"
        text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="320"
        font-weight="900"
        fill="#d4af37"
        stroke="#8a6b12"
        stroke-width="8"
        paint-order="stroke">T</text>

  <!-- Highlight -->
  <text x="256" y="332"
        text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="320"
