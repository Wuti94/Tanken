<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Tankbuch</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./styles.css" />

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self';" />
</head>

<body>
  <header class="topbar">
    <div class="topbar__left">
      <div class="brand">Tankbuch</div>
      <div id="status" class="status"></div>
    </div>
    <div class="topbar__right">
      <button id="btnGoHome" class="iconbtn" title="Start" type="button">Start</button>
      <button id="btnGoSettings" class="iconbtn" title="Einstellungen" type="button">Einstellungen</button>
    </div>
  </header>

  <main class="page">
    <!-- HOME -->
    <section id="viewHome" class="view view--active" aria-label="Startseite">
      <div class="card">
        <h1 class="h1">Tankvorgang</h1>
        <form id="formFillup" class="form">
          <div class="row">
            <label class="field">
              Fahrzeug
              <select id="fillVehicleId" required></select>
            </label>
            <label class="field">
              Kraftstoff
              <select id="fillFuelType" required>
                <option value="DIESEL">Diesel</option>
                <option value="SUPER" selected>Super</option>
              </select>
            </label>
          </div>

          <label class="field">
            Datum & Uhrzeit
            <input id="fillDateTime" type="datetime-local" required />
          </label>

          <div class="row">
            <label class="field">
              KM-Stand
              <input id="fillOdo" type="number" step="1" min="0" required inputmode="numeric" />
            </label>
            <label class="field">
              Liter
              <input id="fillLiters" type="number" step="0.01" min="0" required inputmode="decimal" />
            </label>
          </div>

          <label class="field">
            Notiz (optional)
            <input id="fillNote" placeholder="z. B. Fahrer / Besonderheit" />
          </label>

          <div class="meta" id="fillupPriceInfo"></div>
          <button class="btn btn-primary" type="submit">Speichern</button>
        </form>
      </div>

      <div class="card">
  <div class="card__head">
    <h2 class="h2">Letzter Kalendermonat</h2>
    <div class="muted" id="lastMonthLabel"></div>
  </div>

  <div class="list">
    <div class="item">
      <div class="item__top">
        <div>
          <div class="item__title">Gesamtkosten</div>
          <div class="item__sub" id="lastMonthMeta">–</div>
        </div>
        <div class="item__right">
          <div class="item__big" id="lastMonthCost">–</div>
        </div>
      </div>
    </div>
  </div>
</div>

      <div class="card">
        <div class="card__head">
          <h2 class="h2">Letzte Tankvorgänge</h2>
          <div class="muted" id="fillupsCount"></div>
        </div>
        <div id="listFillups" class="list" aria-label="Liste Tankvorgänge"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="viewSettings" class="view" aria-label="Einstellungen">
      <div class="card">
        <h1 class="h1">Einstellungen</h1>

        <div class="actions">
          <button id="btnOpenVehicles" class="btn btn-secondary" type="button">Fahrzeuge verwalten</button>
          <button id="btnOpenPrices" class="btn btn-secondary" type="button">Preisphasen verwalten</button>
        </div>

        <hr class="sep" />

        <div class="actions">
          <button id="btnExport" class="btn" type="button">Export (Backup-Datei)</button>

          <label class="btn btn-secondary">
            Import (ersetzen)
            <input id="fileImport" type="file" accept="application/json" hidden />
          </label>

          <button id="btnHardReset" class="btn btn-danger" type="button">Alle lokalen Daten löschen</button>
        </div>

        <p class="hint muted">
          Hinweis: Daten liegen nur lokal auf dem Gerät (IndexedDB). Export/Import ist manuell.
        </p>
      </div>
    </section>
  </main>

  <!-- POPUP / MODAL: Vehicles -->
  <div id="modalVehicles" class="modal" hidden aria-hidden="true">
    <div class="modal__backdrop" data-close-modal="modalVehicles"></div>

    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="mvTitle">
      <div class="modal__head">
        <h2 id="mvTitle" class="h2">Fahrzeuge</h2>
        <button id="btnCloseVehicles" class="iconbtn" type="button">Schließen</button>
      </div>

      <div class="card card--flat">
        <form id="formVehicle" class="form">
          <label class="field">
            Name
            <input id="vehicleName" required placeholder="z. B. Transporter" />
          </label>
          <label class="field">
            Kennzeichen (optional)
            <input id="vehiclePlate" placeholder="z. B. AB-XY 123" />
          </label>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Hinzufügen</button>
            <button id="btnSeedVehicles" class="btn btn-secondary" type="button">2 Standard-Fahrzeuge</button>
          </div>
        </form>
      </div>

      <div class="card card--flat">
        <div id="listVehicles" class="list" aria-label="Liste Fahrzeuge"></div>
      </div>
    </div>
  </div>

  <!-- POPUP / MODAL: Prices -->
  <div id="modalPrices" class="modal" hidden aria-hidden="true">
    <div class="modal__backdrop" data-close-modal="modalPrices"></div>

    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="mpTitle">
      <div class="modal__head">
        <h2 id="mpTitle" class="h2">Preisphasen</h2>
        <button id="btnClosePrices" class="iconbtn" type="button">Schließen</button>
      </div>

      <div class="card card--flat">
        <p class="muted">
          Neuer Preis gilt ab 00:00 Uhr des Datums bis zur nächsten Änderung.
        </p>

        <form id="formPrice" class="form">
          <div class="row">
            <label class="field">
              Kraftstoff
              <select id="priceFuelType" required>
                <option value="DIESEL">Diesel</option>
                <option value="SUPER">Super</option>
              </select>
            </label>

            <label class="field">
              Gültig ab (Datum)
              <input id="priceValidFromDate" type="date" required />
            </label>
          </div>

          <label class="field">
            Preis pro Liter (€)
            <input id="pricePerLiter" type="number" step="0.001" min="0" required inputmode="decimal" placeholder="z. B. 1.679" />
          </label>

          <label class="field">
            Notiz (optional)
            <input id="priceNote" placeholder="z. B. Lieferung September" />
          </label>

          <button class="btn btn-primary" type="submit">Preisphase speichern</button>
        </form>
      </div>

      <div class="card card--flat">
        <div id="listPrices" class="list" aria-label="Liste Preisphasen"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
